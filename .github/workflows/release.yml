name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: holo
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: holo
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: holo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            bin: holo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: holo.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../../holo-${{ matrix.target }}.zip ${{ matrix.bin }}
          else
            tar czf ../../../holo-${{ matrix.target }}.tar.gz ${{ matrix.bin }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: holo-${{ matrix.target }}
          path: holo-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            holo-*.tar.gz holo-*.zip
