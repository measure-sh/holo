name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  agent-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-build
      - run: cargo check
      - name: Collect agent blobs
        run: |
          mkdir -p agent-blobs
          find target/debug/build -name 'libholoagent-*.so' -exec cp {} agent-blobs/ \;
          ls -la agent-blobs
      - uses: actions/upload-artifact@v7
        with:
          name: agent-blobs
          path: agent-blobs/

  build:
    needs: agent-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: holo
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: holo
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: holo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            bin: holo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: holo.exe
    runs-on: ${{ matrix.os }}
    env:
      HOLOAGENT_PREBUILT_DIR: ${{ github.workspace }}/agent-blobs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: agent-blobs
          path: agent-blobs
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../../holo-${{ matrix.target }}.zip ${{ matrix.bin }}
          else
            tar czf ../../../holo-${{ matrix.target }}.tar.gz ${{ matrix.bin }}
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: holo-${{ matrix.target }}
          path: holo-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: holo-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            holo-*.tar.gz holo-*.zip
