name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  agent-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-build
      - run: cargo check
      - name: Collect agent blobs
        run: |
          mkdir -p agent-blobs
          find target/debug/build -name 'libholoagent-*.so' -exec cp {} agent-blobs/ \;
          ls -la agent-blobs
      - uses: actions/upload-artifact@v4
        with:
          name: agent-blobs
          path: agent-blobs/

  test:
    needs: agent-build
    runs-on: ubuntu-latest
    env:
      HOLOAGENT_PREBUILT_DIR: ${{ github.workspace }}/agent-blobs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/download-artifact@v4
        with:
          name: agent-blobs
          path: agent-blobs
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  build:
    needs: agent-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      HOLOAGENT_PREBUILT_DIR: ${{ github.workspace }}/agent-blobs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: agent-blobs
          path: agent-blobs
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
